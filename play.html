<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play – Echo Arcade</title>
<meta name="description" content="Play free browser games at Echo Arcade.">
<style>:root{--bg:#070a14;--panel:#0e1426;--panel2:#141c34;--line:#1f2d52;--cyan:#4de3ff;--gold:#ffd04d;--red:#ff5470;--green:#4dff9a;--pink:#ff7ad9;--text:#d6e6f2;--muted:#8097ab}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
a{color:var(--cyan)}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;gap:8px}
.logo{font-weight:800;letter-spacing:4px;color:var(--text);text-decoration:none;font-size:1.25rem}
.logo span{color:var(--cyan)}
nav a{margin-left:16px;text-decoration:none;color:var(--muted)}
nav a:hover{color:var(--cyan)}
main{max-width:1040px;margin:0 auto;padding:16px}
footer{text-align:center;color:var(--muted);padding:24px 12px;font-size:.9rem}
.hero{text-align:center;padding:26px 8px 8px}
.hero h1{margin:0;font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:3px}
.hero h1 span{color:var(--cyan);text-shadow:0 0 18px var(--cyan)}
.hero p{color:var(--muted);max-width:640px;margin:8px auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:.85rem}
.chip.on,.chip:hover{color:#001018;background:var(--cyan);border-color:var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:8px}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--text);transition:.15s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);border-color:var(--cyan);box-shadow:0 6px 28px rgba(77,227,255,.15)}
.card .em{font-size:2.4rem;line-height:1}
.card h3{margin:8px 0 2px;font-size:1.05rem}
.card .meta{font-size:.72rem;color:var(--gold);letter-spacing:1px;text-transform:uppercase}
.card p{font-size:.88rem;color:var(--muted);margin:6px 0 0;flex:1}
.card .pl{font-size:.75rem;color:var(--cyan);margin-top:8px}
.card .new{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;font-size:.65rem;padding:2px 8px;border-radius:99px;font-weight:700}
.featured{border:1px solid var(--gold);background:linear-gradient(135deg,#1a1630,#0e1426);border-radius:14px;padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:10px}
.featured .em{font-size:3rem}
.featured h2{margin:0}
.featured p{margin:4px 0;color:var(--muted)}
.btn{background:var(--panel2);color:var(--cyan);border:1px solid #2a4a7a;border-radius:9px;padding:8px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover:not(:disabled){background:#1c2a4e}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.big{background:var(--cyan);color:#001018;border:0;padding:12px 30px;font-weight:800;letter-spacing:1.5px}
.btn.big:hover{filter:brightness(1.15)}
.btn.gold{background:var(--gold);color:#201600;border:0;font-weight:700}
.adslot{min-height:10px;margin:18px 0;text-align:center}
.content{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 22px 18px;margin-top:18px}
.content h2{color:var(--cyan)}
.content h3{color:var(--gold);margin-bottom:2px}
.page{max-width:760px;margin:0 auto;padding:20px}
.page h1{color:var(--cyan)}
.ptitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.ptitle h1{margin:0;font-size:1.5rem}
.tagpill{background:var(--panel2);border:1px solid var(--line);color:var(--gold);font-size:.7rem;padding:3px 10px;border-radius:99px;letter-spacing:1px;text-transform:uppercase}
.gamebox{position:relative;background:#05070d;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 0 40px rgba(77,227,255,.1);min-height:200px}
.gcanvas{display:block;width:100%;height:auto;touch-action:none;background:#05070d}
.gbar{display:flex;gap:10px 20px;flex-wrap:wrap;justify-content:center;padding:8px 10px;background:var(--panel);font-size:.85rem;color:var(--muted);border-bottom:1px solid var(--line)}
.gbar b{color:var(--cyan)}
.ov{position:absolute;inset:0;background:rgba(5,7,13,.9);display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;z-index:5;overflow:auto}
.ovin{max-width:560px}
.ovin h2{margin:0 0 6px;color:var(--cyan);letter-spacing:3px}
.ovin p{margin:6px 0}
.ovbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.cards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px;background:var(--panel)}
.cards .btn{min-width:84px;text-align:center;line-height:1.2;font-size:.8rem;padding:8px 6px}
.cards .btn.sel{border-color:var(--gold);color:var(--gold)}
.cards .btn .e{font-size:1.5rem;display:block}
.padrow{display:flex;gap:10px;justify-content:center;padding:10px;background:var(--panel);flex-wrap:wrap}
.pbtn{width:78px;height:62px;font-size:1.3rem;border-radius:12px;background:var(--panel2);color:var(--cyan);border:1px solid #2a4a7a;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pbtn:active{background:var(--cyan);color:#001018}
.pbtn.p2{color:var(--pink);border-color:#7a2a62}
.pbtn.p2:active{background:var(--pink);color:#001018}
.dom{padding:16px;max-width:760px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
/* detective */
.dtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}.dot.now{border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
.story{font-size:1.05rem;line-height:1.7;font-family:Georgia,serif}
.story h2{font-family:system-ui;color:var(--gold);margin:0 0 6px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--cyan)}
.opt.right{border-color:var(--green);background:#0d2a1d}
.opt.wrong{border-color:var(--red);background:#2a0f17}
.twist{border-left:4px solid var(--pink);padding:8px 14px;background:#1b1230;border-radius:0 10px 10px 0;margin-top:12px}
.twist b{color:var(--pink);letter-spacing:2px;font-size:.8rem}
.notebook{font-size:.9rem;color:var(--muted)}
.notebook li{margin:4px 0}
/* factory */
.ftabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.ftab{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:.85rem}
.ftab.on{border-color:var(--gold);color:var(--gold)}
.inv{display:flex;flex-wrap:wrap;gap:6px}
.inv span{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:.8rem}
.inv span.zero{opacity:.35}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.frow .nm{min-width:150px;font-weight:600}
.frow .info{color:var(--muted);font-size:.8rem;flex:1;min-width:160px}
.prog{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;width:100%}
.prog i{display:block;height:100%;background:var(--cyan);width:0}
.small{font-size:.8rem;color:var(--muted)}
/* cipher */
.board{display:grid;gap:6px;margin:10px auto;max-width:360px}
.crow{display:flex;gap:8px;align-items:center;justify-content:center}
.slot{width:46px;height:46px;border-radius:50%;background:var(--panel2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.slot.cur{border-color:var(--cyan)}
.pegs{display:grid;grid-template-columns:repeat(2,14px);gap:3px;margin-left:8px}
.peg{width:14px;height:14px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
.peg.b{background:#fff}.peg.w{background:#888}
.pal{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.pal .btn{font-size:1.4rem;padding:6px 12px}
@media(max-width:560px){.slot{width:40px;height:40px;font-size:1.3rem}.frow .nm{min-width:100%}}
.demo{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:12px;box-shadow:0 0 40px rgba(77,227,255,.12);margin-top:12px;background:#080c18}
.demowrap{position:relative}
.demowrap .btn{position:absolute;left:50%;bottom:14px;transform:translateX(-50%)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.card .em{display:inline-block;animation:bob 3s ease-in-out infinite}
.card:nth-child(2n) .em{animation-delay:.6s}.card:nth-child(3n) .em{animation-delay:1.3s}
.card .go{margin-top:10px;color:#001018;background:var(--cyan);border-radius:8px;text-align:center;font-weight:800;padding:6px;font-size:.85rem}
</style>

  }

    if (cur.length !== LEN || done) return;

  }

      if (!won) h += '<p>The code was: <span style="font-size:1.6rem">' + code.map(i => SYM[i]).join(' ') + '</span></p>';
      if (!practice) h += '<p>Next daily cipher in <b id="cd">' + countdown() + '</b></p><button class="btn gold" id="share">📋 Copy result</button> ';
      h += '<button class="btn" id="prac">Play a practice code</button>' + (practice ? ' <button class="btn" id="back">Back to daily</button>' : '') + '</div>';
    }
    wrap.innerHTML = h;
    wrap.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { if (cur.length < LEN) { cur.push(+b.dataset.c); A.beep(500, .05); render(); } });
    const del = wrap.querySelector('#del'); if (del) del.onclick = () => { cur.pop(); render(); };
    const sub = wrap.querySelector('#sub'); if (sub) sub.onclick = submit;
    const sh = wrap.querySelector('#share'); if (sh) sh.onclick = () => {
      const t = shareText();
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => { sh.textContent = '✅ Copied!'; }, () => prompt('Copy your result:', t)); else prompt('Copy your result:', t);
    };

  }
  A.onKey(k => {

    else if (k === 'enter') submit();
  });

  load(); render();
});

        cows.forEach(c => {
          const under = beam && Math.abs(c.x - ufo.x) < 46;
          if (under) { c.lift = Math.min(1, c.lift + dt / 1.0); }
          else c.lift = Math.max(0, c.lift - dt * 1.5);
          if (c.lift === 0) { c.x += c.vx * dt; if (c.x < 30 || c.x > W - 30) c.vx *= -1; if (Math.random() < dt * .3) c.vx = A.rand(-55, 55); }
          if (c.lift >= 1) { score++; A.beep(900, .3, 'sine', .08); pops.push({ x: c.x, y: ufo.y + 40, t: 'MOO!', life: .9 }); Object.assign(c, mkCow(), { x: A.rand(40, W - 40) }); }
        });
        const nf = Math.min(4, 1 + Math.floor(score / 6));
        while (farmers.length < nf) farmers.push(mkFarmer());
        farmers.forEach(f => {
          f.x += f.vx * dt * diff; if (f.x < 30 || f.x > W - 30) f.vx *= -1;
          f.t -= dt;
          if (f.t <= 0) { f.t = A.rand(1.6, 3.4) / diff; const dx = ufo.x - f.x, dy = ufo.y - GY, d = Math.hypot(dx, dy); forks.push({ x: f.x, y: GY - 20, vx: dx / d * 330 * diff, vy: dy / d * 330 * diff }); A.beep(260, .08, 'square', .03); }
        });
        hurtT = Math.max(0, hurtT - dt);
        forks.forEach(f => { f.x += f.vx * dt; f.y += f.vy * dt; if (hurtT <= 0 && Math.hypot(f.x - ufo.x, f.y - ufo.y) < 34) { f.dead = true; lives--; hurtT = 1.2; A.beep(110, .3, 'sawtooth', .08); if (lives <= 0) over(); } if (f.y < -20 || f.x < -20 || f.x > W + 20) f.dead = true; });
        forks = forks.filter(f => !f.dead);
        pops.forEach(p => { p.y -= 35 * dt; p.life -= dt; }); pops = pops.filter(p => p.life > 0);
      }
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0b1030'); g.addColorStop(1, '#2a3a6a'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff'; for (let i = 0; i < 40; i++) ctx.fillRect((i * 97) % W, (i * 53) % 300, 2, 2);
      ctx.fillStyle = '#2f6b3a'; ctx.fillRect(0, GY, W, H - GY);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (ufo) {
        if (beam) { const gr = ctx.createLinearGradient(0, ufo.y, 0, GY); gr.addColorStop(0, 'rgba(120,255,160,.55)'); gr.addColorStop(1, 'rgba(120,255,160,.15)'); ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(ufo.x - 18, ufo.y + 20); ctx.lineTo(ufo.x + 18, ufo.y + 20); ctx.lineTo(ufo.x + 52, GY + 20); ctx.lineTo(ufo.x - 52, GY + 20); ctx.fill(); }
        ctx.font = '40px serif';
        cows.forEach(c => ctx.fillText('🐄', c.x, GY + 4 - c.lift * (GY - ufo.y - 30)));
        farmers.forEach(f => ctx.fillText('🧑‍🌾', f.x, GY));
        forks.forEach(f => ctx.fillText('🔱', f.x, f.y));
        ctx.globalAlpha = hurtT > 0 && Math.floor(hurtT * 10) % 2 ? .3 : 1; ctx.font = '64px serif'; ctx.fillText('🛸', ufo.x, ufo.y); ctx.globalAlpha = 1;
        ctx.font = 'bold 22px system-ui'; ctx.fillStyle = '#fff'; pops.forEach(p => { ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillText(p.t, p.x, p.y); }); ctx.globalAlpha = 1;
        ctx.fillStyle = '#123'; ctx.fillRect(20, H - 22, 200, 10); ctx.fillStyle = locked ? '#ff5470' : '#4dff9a'; ctx.fillRect(20, H - 22, 2 * energy, 10);
      }
      bar.innerHTML = '<span>COWS <b>' + (score || 0) + '</b></span><span>LIVES <b>' + '❤'.repeat(Math.max(0, lives == null ? 3 : lives)) + '</b></span><span>BEST <b>' + A.getBest('cow-beam', 0) + '</b></span><span>Move mouse / arrows • hold click / Space = beam</span>';
    });
    A.overlay(box, '<h2>COW BEAM</h2><p>You are a UFO. Hold the tractor beam over a cow until it floats up. Farmers throw pitchforks. The beam drains energy (green bar). 3 lives.<br>Mouse/finger/arrows to move • hold click/touch/<b>Space</b> to beam.</p>', [{ label: '▶ ABDUCT', fn: start }]);
  }

  const map = { 'pigeon-mail': pigeon, 'toast-tower': toast, 'cat-chaos': cat, 'emoji-match': emoji, 'chicken-showdown': chicken, 'cow-beam': cow };
  (map[id] || function () { box.textContent = 'Unknown game'; })();
});

</script>
<script>
(function(){
  document.getElementById('yr').textContent = new Date().getFullYear();
  var id = Arcade.gameId;
  var g = GAMES.filter(function(x){return x.id === id;})[0];
  var box = document.getElementById('gamebox');
  if (!g || !g.file) {
    if (g && g.url) { location.replace(g.url); return; }
    document.getElementById('pt').textContent = 'Game not found';
    box.innerHTML = '<p style="padding:20px">That game does not exist. <a href="index.html">Back to all games</a></p>';
    return;
  }
  document.title = g.title + ' – Free Browser Game | Echo Arcade';
  document.querySelector('meta[name=description]').setAttribute('content', g.desc);
  document.getElementById('pt').textContent = g.title;
  document.getElementById('pe').textContent = g.emoji;
  document.getElementById('ptag').textContent = g.tag;
  document.getElementById('ppl').textContent = '👥 ' + g.players;
  var li = function(a){return a.map(function(s){return '<li>'+s+'</li>';}).join('');};
  document.getElementById('info').innerHTML =
    '<h2>About ' + g.title + '</h2><p>' + g.desc + '</p>' +
    '<h3>How to play</h3><ul>' + li(g.how) + '</ul>' +
    '<h3>Tips</h3><ul>' + li(g.tips) + '</ul>' +
    '<p class="small">Your progress and best scores are stored only in this browser.</p>';
  var more = document.getElementById('more');
  GAMES.filter(function(x){return x.id !== id;}).sort(function(){return Math.random()-.5;}).slice(0,6).forEach(function(x){
    var a = document.createElement('a'); a.className = 'card';
    a.href = x.url ? x.url : 'play.html?g=' + x.id;
    a.innerHTML = '<div class="em">'+x.emoji+'</div><div class="meta">'+x.tag+'</div><h3>'+x.title+'</h3><p>'+x.desc+'</p>';
    more.appendChild(a);
  });
  var m = document.getElementById('mute');
  var paint = function(){ m.textContent = Arcade.muted ? '🔇' : '🔊'; };
  paint();
  m.onclick = function(e){ e.preventDefault(); Arcade.muted = !Arcade.muted; Arcade.store.set('muted', Arcade.muted); paint(); };
  var fn = Arcade.games[g.file];
  if (fn) fn(box, Arcade); else box.innerHTML = '<p style="padding:20px">Game code missing.</p>';
})();
</script>
